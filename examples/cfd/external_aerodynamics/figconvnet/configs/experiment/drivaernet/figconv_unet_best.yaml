defaults:
  - /data: drivaernet
  # - /model: figconv_unet_enhanced_drivaer
  - /model: figconv_unet_drivaer
  # - /loss: mseloss
  - /loss: huberloss
  - /optimizer: adamw
  # - /optimizer: adam  
  # - /lr_scheduler: reducelronplateau
  # - /lr_scheduler: steplr
  - /lr_scheduler: cosineannealingwarmrestarts


rank0_only: true

# Loss weights
pressure_loss_weight: 1.0    # 主要任务权重
drag_loss_weight: 0.0       # 辅助任务权重，设置较小以不影响主要任务

# test_best_only: true
# output: outputs/2025-05-23/18-43-01

amp:
  enabled: false
  autocast:
    dtype: torch.float16
  scaler:
    _target_: torch.cuda.amp.GradScaler
    enabled: ${..enabled}
  clip_grad: false
  grad_max_norm: 2.0

train:
  batch_size: 8
  num_epochs: 1000
  dataloader:
    num_workers: 0  # 增加num_workers提高数据加载效率
    pin_memory: true
    shuffle: true
  lr_scheduler_mode: epoch
  print_interval: 20
  save_interval: 1
  save_checkpoints: 2
  resume: false
  early_stopping:
    enabled: true
    patience: 40  # Number of epochs to wait before stopping
    verbose: true  # Whether to print messages
    # delta: 1.0e-12  # Minimum change in validation loss to qualify as an improvement
    delta: 0  # Minimum change in validation loss to qualify as an improvement
    mode: "min"  # Whether to minimize (for losses) or maximize (for accuracies) metrics
    metric_weights:  # Weights for different metrics, all metrics should be in the same direction (min or max)
      val_loss: 1.0  # Validation loss (primary metric)
      # pressure_rel_l2: 1.0 [
lr_scheduler:
  # reducelronplateau
  # factor: 0.5
  # patience: 10
  # steplr
  # gamma: 0.5
  # step_size: 15
  # CosineAnnealingWarmRestarts
  T_0: 40    # 第一次重启的周期长度
  T_mult: 1  # 每次重启后周期长度的倍数
  eta_min: 1.0e-6  # 最小学习率 

optimizer:
  lr: 0.001
  weight_decay: 0.0001
      
eval:
  batch_size: 8
  interval: 5
  plot_interval: 20
  print_interval: 20
  dataloader:
    num_workers: 0

data:
  num_points: 16384  #32768
  # num_points: 32768  #32768
  preprocessors:
  # - _target_: src.data.data_augmentation.DrivAerNetAugmentationPreprocessor
  #   config:
  #     enable_translation: false
  #     translation_range: [0.9, 1.1]
  #     enable_jitter: true
  #     jitter_sigma: 0.01
  #     jitter_clip: 0.02
  #     enable_drop: false
  #     drop_rate: 0.1
  - _target_: src.data.drivaernet_datamodule.DrivAerNetPreprocessor
    num_points: ${...num_points}
model:
  aabb_max: [ 2.75,  1.5,  1.0]
  aabb_min: [-2.75, -1.5, -1.0]
  hidden_channels: [16,32,48]  # 从[16,32,48]增加到[24,48,72]，约50%提升
  in_channels: 1
  kernel_size: 5
  neighbor_search_type: radius
  # neighbor_search_type: knn
  # knn_k: 32
  num_down_blocks: [1, 1] 
  num_up_blocks: [1, 1]
  num_levels: 2
  out_channels: 1
  pooling_layers: [2]
  pooling_type: max
  # 增加位置编码维度以更好地捕获空间信息
  pos_encode_dim: 32  # 从32增加到48
  # 使用多种reduction以捕获不同的统计特征
  reductions: [mean, max]
  # 适度增加网格分辨率以提高精度
  resolution_memory_format_pairs:
    # - ${res_mem_pair:b_xc_y_z, [  5, 150, 100]}
    # - ${res_mem_pair:b_yc_x_z, [250,   3, 100]}
    # - ${res_mem_pair:b_zc_x_y, [250, 150,   2]}
    # - ${res_mem_pair:b_xc_y_z, [8, 150, 100]}
    # - ${res_mem_pair:b_yc_x_z, [250, 6, 100]}
    # - ${res_mem_pair:b_zc_x_y, [250, 150, 4]}
    # - ${res_mem_pair:b_xc_y_z, [11, 150, 100]}
    # - ${res_mem_pair:b_yc_x_z, [275, 6, 100]}
    # - ${res_mem_pair:b_zc_x_y, [275, 150, 4]}
    - ${res_mem_pair:b_xc_y_z, [10, 150, 100]}
    - ${res_mem_pair:b_yc_x_z, [250, 10, 100]}
    - ${res_mem_pair:b_zc_x_y, [250, 150, 10]}
  use_rel_pos_encode: true
  use_mamba: true
  mamba_cfg:
    d_state: 64
    d_conv: 4
    expand: 2
  use_mamba_in_skip: true
  mamba_skip_cfg:
    d_state: 64
    d_conv: 4
    expand: 2

loggers:
  wandb:
    mode: offline  # 改为离线模式
    entity: weilr987-bupt
    project_name: physicsnemo
    group_name: fignet
    # run_name: FIGConvNet-level2-16,16,16-res250-150-100-pool-max-2-aabb-275x15x1-ks5-np32768-b8x2
    run_name: FIGConvNet-${now:%Y%m%d_%H%M%S}-level${model.num_levels}-${model.hidden_channels}-pool-${model.pooling_type}-${model.pooling_layers.0}-aabb-${model.aabb_max[0]}x${model.aabb_max[1]}x${model.aabb_max[2]}-ks${model.kernel_size}-np${data.num_points}-b${train.batch_size}-res${model.resolution_memory_format_pairs}
seed: 3407
